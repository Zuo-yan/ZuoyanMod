# Forge 1.20.1 模组描述文件
# loaderVersion：FML 主版本；license：许可协议
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL=""

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Curios API：可选依赖。装有 Curios 时饰品必须佩戴进饰品栏生效；
# 未安装时饰品放背包生效（判定见 org.gwfx.zuoyanmod.util.AccessoryChecks）。
[[dependencies.${mod_id}]]
modId="curios"
mandatory=false
versionRange="[5,)"
ordering="AFTER"
side="BOTH"
