# 设置 Gradle 命令默认使用的内存上限。可由用户或命令行参数覆盖。
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## 版本配置（1.20.1 Forge 分支）
# ⚠️ 跨 Minecraft 版本迁移时，本文件里所有 *_version / *_version_range 属性
#    （以及 build.gradle 里 JEI 的 CurseMaven file ID）就是构建侧要改的全部内容；
#    代码侧要改的位置见 docs/version_migration.md。
# ForgeGradle 6 只支持 Gradle 8.x（见 gradle/wrapper/gradle-wrapper.properties）
minecraft_version=1.20.1

# Minecraft 版本范围
minecraft_version_range=[1.20.1,1.21)

# Forge 版本（必须与 Minecraft 版本对应）
forge_version=47.2.0

# Forge 版本范围
forge_version_range=[47,)

# Loader（FML）版本范围
loader_version_range=[47,)

# 档案映射：official = Mojang 官方名（mojmap）
mapping_channel=official
mapping_version=1.20.1

## 模组配置属性
# 模组的全局唯一标识符（Mod ID）。在英文环境下必须全小写，且必须符合正则 [a-z][a-z0-9_]{1,63}。
# 必须与主模组类中带有 @Mod 注解的字符串常量一致。
mod_id=zuoyanmod

# 在模组列表中展示的人类可读模组名称。
mod_name=ZuoyanMod

# 模组开源许可协议。
mod_license=All Rights Reserved

# 模组版本号，遵循语义化版本规范。详见 https://semver.org/
mod_version=1.3-1.20.1-SNAPSHOT

# 模组的 Group ID（组织 ID）。仅在将构件发布到 Maven 仓库时至关重要。
mod_group_id=org.gwfx

# 模组作者列表。简单的纯文本字符串，仅用于在游戏内模组列表中展示。
mod_authors=Zuo_yan

# 模组描述信息。可换行的简单文本字符串，仅用于在游戏内模组列表中展示。
mod_description=过往浮现专属Mod
