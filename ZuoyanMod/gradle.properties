# 设置 Gradle 命令默认使用的内存上限。可由用户或命令行参数覆盖。
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## 环境配置属性
# ⚠️ 跨 Minecraft 版本迁移时，本文件里所有 *_version / *_version_range 属性
#    （以及 build.gradle 里 JEI / Curios 的 CurseMaven file ID）就是构建侧要改的全部内容；
#    代码侧要改的位置见 docs/version_migration.md。
# 你可以在此处查看最新版本: https://projects.neoforged.net/neoforged/neoforge
# Minecraft 版本必须与 NeoForge 版本匹配才能正确获取构建依赖
minecraft_version=1.26.3.0

# Minecraft 版本范围：可以使用 Minecraft 的任意正式发布版本作为界限。
# 快照版本（Snapshot）、预发布版本（Pre-release）和候选发布版本（RC）无法保证正确排序，
# 因为它们不遵循标准版本规范。
minecraft_version_range=[26.3, 27)

# NeoForge 版本必须与 Minecraft 版本对应才能正确获取构件
neo_version=26.3.0.3-beta

# NeoForge 版本范围：可以使用任意版本的 NeoForge 作为界限
neo_version_range=[26,)

# Loader（加载器）版本范围：只能使用 FML 的主版本号作为界限
loader_version_range=[4,)

parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.21-nightly-SNAPSHOT

## 模组配置属性
# 模组的全局唯一标识符（Mod ID）。在英文环境下必须全小写，且必须符合正则 [a-z][a-z0-9_]{1,63}。
# 必须与主模组类中带有 @Mod 注解的字符串常量一致。
mod_id=zuoyanmod

# 在模组列表中展示的人类可读模组名称。
mod_name=ZuoyanMod

# 模组开源许可协议。可在 https://choosealicense.com/ 查看可选协议。默认为 All Rights Reserved（保留所有权利）。
mod_license=All Rights Reserved

# 模组版本号，遵循语义化版本规范。详见 https://semver.org/
# 2.6：内置 AI 助手（第三方大模型接入、只读工具、管理员级指令与 AI 建造）。详见 docs/ai.md
mod_version=2.6-neoForge-26.3

# 模组的 Group ID（组织 ID）。仅在将构件发布到 Maven 仓库时至关重要。
# 该项通常应与模组源码的基础包路径一致。
# 详情参阅: https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=org.gwfx

# 模组作者列表。简单的纯文本字符串，仅用于在游戏内模组列表中展示。
mod_authors=Zuo_yan

# 模组描述信息。可换行的简单文本字符串，仅用于在游戏内模组列表中展示。
# 需要换行就写 \n（Properties 会把它转成真正的换行，再被 build.gradle 的 expand 填进 mods.toml）。
mod_description=以「虚空 / 绝对零度 / 领域展开」等机制为核心的整合型模组，并内置一个可选的 AI 助手：用你自己的第三方大模型密钥进行中文问答，能查周围方块与容器、检索配方、查看全服状态；管理员还可让它提议执行指令、按蓝图分 tick 建造并撤销。AI 全部能力默认关闭，密钥加密存储、绝不外发。详见 docs/ai.md。