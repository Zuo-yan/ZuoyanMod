plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    // 基础公共仓库
    mavenCentral()

    // 引入 CurseMaven 仓库（解析 curse.maven 依赖必须）
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    // 备用镜像仓库
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// 强制所有文本处理走 UTF-8。
// 为什么不依赖构建机的默认编码：Gradle 的 ProcessResources（含 expand()）与 javac
// 默认按 "平台编码" 读写文本，Windows 中文系统的旧版 JDK 该值是 GBK。
// 本仓库源码含 430 处中文字符串字面量（GUI 文本、物品提示）与 122 个中文 javadoc 文件，
// 资源侧 lang/*.json 与 neoforge.mods.toml 也是 UTF-8 —— 一旦在 GBK 机器上构建，
// javac 会把 UTF-8 的中文常量按 GBK 读入再写进 class 常量池，expand() 会破坏 mods.toml，
// 结果是别人克隆过去一编译，游戏内文字全成乱码（本机 file.encoding=UTF-8 时反而看不出来）。
// 因此这里显式锁死编码，与构建机环境解耦。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

// javadoc 同样需要显式指定，否则中文注释在 GBK 机器上会告警/乱码
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

neoForge {
    // 指定要使用的 NeoForge 版本
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // 默认的运行配置
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 包含数据生成器生成的资源文件
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // 使用 CurseMaven 作为开发期运行环境加载 JEI（不强绑定到你的发布产物中）
    // 项目 ID: 238222 (JEI), 文件 ID: 8941416
    // compileOnly：四维空间工作台要接 JEI 的配方传输 API，需要编译期可见；
    // runtimeOnly：开发环境下真的把 JEI 跑起来。两者同时声明不冲突。
    compileOnly "curse.maven:jei-238222:8941416"
    runtimeOnly "curse.maven:jei-238222:8941416"

    // Curios API（可选集成）：仅编译期可见 + 开发运行环境加载，不打包进发布产物。
    // 运行时由玩家自行安装；未安装 Curios 时饰品走"放背包生效"逻辑。
    compileOnly "curse.maven:curios-309927:8945239"
    runtimeOnly "curse.maven:curios-309927:8945239"
}

// 展开元数据替换属性
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}