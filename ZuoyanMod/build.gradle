plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// 强制所有文本处理走 UTF-8。
// 为什么不依赖构建机的默认编码：Gradle 的 ProcessResources（含 expand()）与 javac
// 默认按 "平台编码" 读写文本，Windows 中文系统的旧版 JDK 该值是 GBK。
// 本仓库源码有大量中文字符串字面量（GUI 文本、物品提示）与中文 javadoc，
// 资源侧 lang/*.json 与 mods.toml 也是 UTF-8 —— 一旦在 GBK 机器上构建，
// javac 会把 UTF-8 的中文常量按 GBK 读入再写进 class 常量池，expand() 会破坏 mods.toml，
// 结果是别人克隆过去一编译，游戏内文字全成乱码（本机 file.encoding=UTF-8 时反而看不出来）。
// 因此这里显式锁死编码，与构建机环境解耦。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

// 1.20.1 Forge 用 ForgeGradle 6：official 通道 = Mojang 官方映射（mojmap），
// 与 26.3 主线用的映射命名体系一致，移植时类名/方法名风格不用切换。
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

// 包含数据生成器生成的资源文件
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    // CurseMaven：解析 JEI 的 curse.maven 依赖
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // JEI 1.20.1 Forge（15.20.0.133，File ID 8367520）：
    // compileOnly：四维空间工作台要接 JEI 的配方传输 API，需要编译期可见；
    // runtimeOnly：开发环境下真的把 JEI 跑起来。
    compileOnly fg.deobf("curse.maven:jei-238222:8367520")
    runtimeOnly fg.deobf("curse.maven:jei-238222:8367520")

    // Curios API 1.20.1 Forge（File ID 6418456，可选集成）：
    // **只 compileOnly，不进 runtime**。原因：该构建的 mixin 用的是 SRG 版 refmap
    // （curios.refmap.json 把 getFirstTick 映射成 f_19803_），ForgeGradle 6 的 fg.deobf
    // 没有把它重映射到 official 名，于是 dev 环境一启动就
    // "Mixin apply failed curios.mixins.json:AccessorEntity ... No candidates were found
    //  matching f_19803_:Z"，整个 dev 客户端/服务端起不来（与我们的模组无关）。
    // 结果：编译期能拿到 Curios API（CuriosCompat 正常编译），dev 环境不加载 Curios
    // （饰品走"放背包生效"，即本分支原有行为）；正式环境玩家自行装 Curios 即启用饰品栏。
    compileOnly fg.deobf("curse.maven:curios-309927:6418456")
}

// mods.toml / pack.mcmeta 里的 ${} 占位符用 gradle.properties 展开
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    replaceProperties.put 'project', project
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'  : mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}
